<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisRevision · QCM ASV</title>
<style>
:root{
  --bg:#0a0d08; --bg2:#121810; --card:rgba(255,255,255,.03); --bdr:rgba(255,255,255,.08);
  --txt:#d8e8d0; --txt2:#4a6840; --em:#78d840; --green:#4ade80; --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg) 100%);color:var(--txt);min-height:100vh;padding-bottom:40px}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
header{padding:24px 0 16px;text-align:center}
.badge{display:inline-block;background:rgba(120,216,64,.1);border:1px solid rgba(120,216,64,.25);color:var(--em);padding:4px 14px;border-radius:20px;font-size:11px;letter-spacing:2px;font-family:monospace;margin-bottom:12px}
h1{font-family:Georgia,serif;font-size:26px;font-weight:300}
h1 em{font-style:italic;color:var(--em)}

.uc-intro{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:16px;font-size:12.5px;color:var(--txt2);line-height:1.6}
.uc-intro strong{color:var(--em)}

.uc-select{display:flex;gap:8px;overflow-x:auto;margin:16px 0}
.uc-chip{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:8px 16px;font-size:12.5px;color:var(--txt2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.uc-chip.active{background:var(--em);color:#04120a;font-weight:700;border-color:var(--em)}
.uc-chip.soon{opacity:.4;cursor:not-allowed}

.progress{font-size:13px;color:var(--txt2);text-align:center;margin-bottom:16px}
.progress b{color:var(--em)}

.question-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:20px;margin-bottom:16px}
.module-tag{font-size:10.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.question-text{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:16px}

.option{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--bdr);margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.5}
.option:active{border-color:var(--em)}
.option.correct{background:rgba(74,222,128,.1);border-color:var(--green)}
.option.incorrect{background:rgba(248,113,113,.1);border-color:var(--red)}
.option-letter{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}

.explanation{display:none;background:rgba(120,216,64,.06);border:1px solid rgba(120,216,64,.2);border-radius:12px;padding:14px;margin-top:12px;font-size:13.5px;line-height:1.6}
.explanation.show{display:block}

.nav-btn{padding:12px;border-radius:12px;border:1px solid var(--bdr);background:var(--em);color:#04120a;font-weight:700;font-size:14px;cursor:pointer;text-align:center;margin-top:16px}

.score-final{text-align:center;padding:40px 20px}
.score-final .big{font-size:48px;font-weight:800;color:var(--em)}

.soon-msg{text-align:center;color:var(--txt2);padding:40px 20px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">RÉVISION QCM</div>
    <h1>Praxis<em>Revision</em></h1>
  </header>

  <div class="uc-intro">Structure officielle du titre <strong>ASV GIPSA</strong> (APFORM/SNVEL) : 4 unités de compétences, toutes couvertes ici — <strong>relation clientèle, organisation interne, hygiène, et soins/chirurgie</strong>.</div>

  <div class="uc-select" id="uc-select"></div>
  <div class="progress" id="progress"></div>
  <div id="quiz-container"></div>
</div>

<script src="qcm-veto-data.js"></script>
<script>
const UC_LABELS = {
  uc1: 'UC1 · Clientèle',
  uc2: 'UC2 · Organisation',
  uc3: 'UC3 · Hygiène',
  uc4: 'UC4 · Soins/Chirurgie',
};
const UC_DISPONIBLES = Object.keys(QCM_VETO);
let ucActuelle = UC_DISPONIBLES[0];
let indexActuel = 0;
let score = 0;
let repondu = false;

function afficherUC(){
  document.getElementById('uc-select').innerHTML = Object.keys(UC_LABELS).map(uc => {
    const disponible = UC_DISPONIBLES.includes(uc);
    const classe = uc === ucActuelle ? 'active' : (disponible ? '' : 'soon');
    return `<div class="uc-chip ${classe}" ${disponible ? `onclick="choisirUC('${uc}')"` : ''}>${UC_LABELS[uc]}${disponible ? '' : ' (bientôt)'}</div>`;
  }).join('');
}

function choisirUC(uc){
  if(!UC_DISPONIBLES.includes(uc)) return;
  ucActuelle = uc;
  indexActuel = 0;
  score = 0;
  afficherUC();
  afficherQuestion();
}

function afficherQuestion(){
  const questions = QCM_VETO[ucActuelle];
  if(indexActuel >= questions.length){
    afficherScoreFinal(questions.length);
    return;
  }
  const q = questions[indexActuel];
  repondu = false;
  document.getElementById('progress').innerHTML = `Question <b>${indexActuel + 1}</b> / ${questions.length} — Score : <b>${score}</b>`;

  const lettres = ['A','B','C','D'];
  document.getElementById('quiz-container').innerHTML = `
    <div class="question-card">
      <div class="module-tag">${q.module}</div>
      <div class="question-text">${q.q}</div>
      <div id="options">
        ${q.opts.map((opt, i) => `
          <div class="option" id="opt-${i}" onclick="repondre(${i})">
            <div class="option-letter">${lettres[i]}</div>
            <div>${opt}</div>
          </div>
        `).join('')}
      </div>
      <div class="explanation" id="explanation">${q.expl}</div>
      <button class="nav-btn" id="btn-suivant" onclick="questionSuivante()" style="display:none">Question suivante →</button>
    </div>
  `;
}

function repondre(i){
  if(repondu) return;
  repondu = true;
  const q = QCM_VETO[ucActuelle][indexActuel];
  const options = document.querySelectorAll('.option');
  options.forEach((opt, idx) => {
    if(idx === q.rep) opt.classList.add('correct');
    else if(idx === i) opt.classList.add('incorrect');
  });
  if(i === q.rep) score++;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('btn-suivant').style.display = 'block';
  document.getElementById('progress').innerHTML = `Question <b>${indexActuel + 1}</b> / ${QCM_VETO[ucActuelle].length} — Score : <b>${score}</b>`;
}

function questionSuivante(){
  indexActuel++;
  afficherQuestion();
}

function afficherScoreFinal(total){
  document.getElementById('quiz-container').innerHTML = `
    <div class="question-card score-final">
      <div class="big">${score}/${total}</div>
      <p style="color:var(--txt2);margin-top:8px">Bloc terminé</p>
      <button class="nav-btn" onclick="choisirUC('${ucActuelle}')" style="display:inline-block">Recommencer ce bloc</button>
    </div>
  `;
  document.getElementById('progress').innerHTML = '';
}

afficherUC();
afficherQuestion();
</script>
</body>
</html>
